<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sudoku · Ethos Labs</title>
<style>
  :root {
    --bg-color: #0b0d17;
    --panel-bg: #141624;
    --border-color: rgba(255, 255, 255, 0.1);
    --text-color: #eef0fb;
    --text-given: #ffffff;
    --text-user: #9ecbff;
    --accent: #065f46;
    --accent-hover: #047857;
    --accent-light: #10b981;
    --cell-selected: rgba(16, 185, 129, 0.25);
    --cell-error: rgba(239, 68, 68, 0.4);
    --grid-thick: #047857;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background-color: var(--bg-color);
    color: var(--text-color);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }

  .container {
    width: 100%;
    max-width: 480px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  header h1 { font-size: 24px; color: #fff; }
  header span { font-size: 14px; opacity: 0.6; }

  .controls {
    display: flex;
    gap: 8px;
    background: var(--panel-bg);
    padding: 10px;
    border-radius: 12px;
    border: 1px solid var(--border-color);
    align-items: center;
  }
  
  select, button {
    background: var(--bg-color);
    color: var(--text-color);
    border: 1px solid var(--border-color);
    padding: 8px 12px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 500;
    transition: all 0.2s ease;
  }
  select:hover, button:hover { border-color: var(--accent-light); }
  button.primary { background: var(--accent); border: none; }
  button.primary:hover { background: var(--accent-hover); }

  .stats-bar {
    display: flex;
    justify-content: space-around;
    background: var(--panel-bg);
    padding: 10px;
    border-radius: 12px;
    border: 1px solid var(--border-color);
    text-align: center;
  }
  .stat-val { font-size: 18px; font-weight: bold; }
  .stat-lbl { font-size: 10px; opacity: 0.6; text-transform: uppercase; }

  #board {
    display: grid;
    grid-template-columns: repeat(9, 1fr);
    grid-template-rows: repeat(9, 1fr);
    aspect-ratio: 1/1;
    background: var(--panel-bg);
    border: 2px solid var(--grid-thick);
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 10px 25px rgba(0,0,0,0.5);
  }

  .cell {
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(16px, 4vw, 22px);
    font-weight: 500;
    color: var(--text-user);
    border: 1px solid var(--border-color);
    cursor: pointer;
    user-select: none;
    transition: background 0.15s ease, transform 0.1s ease;
  }

  /* Bordes de las subcuadrículas 3x3 */
  .cell:nth-child(3n) { border-right: 2px solid var(--grid-thick); }
  .cell:nth-child(9n+1) { border-left: 2px solid var(--grid-thick); }
  .row-bottom { border-bottom: 2px solid var(--grid-thick) !important; }

  /* Estados de celda y Animaciones */
  .cell.given { color: var(--text-given); font-weight: bold; cursor: default; }
  .cell.selected { background: var(--cell-selected); }
  .cell.error { background: var(--cell-error); animation: shake 0.3s ease; }
  
  .cell.placed { animation: pop 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275); }

  @keyframes pop {
    0% { transform: scale(0.8); opacity: 0.5; }
    50% { transform: scale(1.15); }
    100% { transform: scale(1); opacity: 1; }
  }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-4px); }
    75% { transform: translateX(4px); }
  }

  .numpad {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
  }
  .numpad button {
    padding: 12px 0;
    font-size: 18px;
    font-weight: bold;
  }

  .actions {
    display: flex;
    gap: 8px;
  }
  .actions button { flex: 1; }
</style>
</head>
<body>

<div class="container">
  <header>
    <h1>Sudoku</h1>
    <span>Ethos Labs</span>
  </header>

  <div class="controls">
    <select id="diffSelect">
      <option value="easy">Fácil</option>
      <option value="medium" selected>Medio</option>
      <option value="hard">Difícil</option>
    </select>
    <div style="flex:1"></div>
    <button id="btnNew" class="primary">Nueva partida</button>
  </div>

  <div class="stats-bar">
    <div><div class="stat-val" id="timer">00:00</div><div class="stat-lbl">Tiempo</div></div>
    <div><div class="stat-val" id="errors">0</div><div class="stat-lbl">Errores</div></div>
    <div><div class="stat-val" id="streak">0</div><div class="stat-lbl">Racha</div></div>
  </div>

  <div id="board"></div>

  <div class="numpad" id="numpad"></div>

  <div class="actions">
    <button id="btnErase">🧽 Borrar</button>
    <button id="btnHint">💡 Pista</button>
  </div>
</div>

<script>
// Lógica principal simplificada
let state = {
  puzzle: [],
  solution: [],
  board: [],
  given: [],
  selected: null,
  errors: 0,
  timer: 0,
  timerInterval: null
};

// Generador simplificado de tablero válido
function generateSudoku() {
  const solution = [
    [5,3,4,6,7,8,9,1,2],
    [6,7,2,1,9,5,3,4,8],
    [1,9,8,3,4,2,5,6,7],
    [8,5,9,7,6,1,4,2,3],
    [4,2,6,8,5,3,7,9,1],
    [7,1,3,9,2,4,8,5,6],
    [9,6,1,5,3,7,2,8,4],
    [2,8,7,4,1,9,6,3,5],
    [3,4,5,2,8,6,1,7,9]
  ];
  
  // Clonar y ocultar celdas según dificultad
  const puzzle = solution.map(row => [...row]);
  const level = document.getElementById('diffSelect').value;
  const hideCount = level === 'easy' ? 30 : level === 'medium' ? 45 : 55;

  let hidden = 0;
  while(hidden < hideCount) {
    let r = Math.floor(Math.random() * 9);
    let c = Math.floor(Math.random() * 9);
    if(puzzle[r][c] !== 0) {
      puzzle[r][c] = 0;
      hidden++;
    }
  }

  return { puzzle, solution };
}

function startNewGame() {
  const { puzzle, solution } = generateSudoku();
  state.puzzle = puzzle;
  state.solution = solution;
  state.board = puzzle.map(row => [...row]);
  state.given = puzzle.map(row => row.map(v => v !== 0));
  state.selected = null;
  state.errors = 0;

  document.getElementById('errors').textContent = '0';
  document.getElementById('streak').textContent = localStorage.getItem('sudoku_streak') || '0';
  
  resetTimer();
  renderBoard();
}

function renderBoard() {
  const boardEl = document.getElementById('board');
  boardEl.innerHTML = '';

  for(let r = 0; r < 9; r++) {
    for(let c = 0; c < 9; c++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      if(r === 2 || r === 5) cell.classList.add('row-bottom');

      if(state.given[r][c]) {
        cell.classList.add('given');
        cell.textContent = state.board[r][c];
      } else if(state.board[r][c] !== 0) {
        cell.textContent = state.board[r][c];
      }

      cell.addEventListener('click', () => selectCell(r, c));
      boardEl.appendChild(cell);
    }
  }
}

function selectCell(r, c) {
  state.selected = [r, c];
  const cells = document.querySelectorAll('.cell');
  cells.forEach(el => el.classList.remove('selected'));
  
  const index = r * 9 + c;
  cells[index].classList.add('selected');
}

function placeNumber(num) {
  if(!state.selected) return;
  const [r, c] = state.selected;
  if(state.given[r][c]) return;

  const index = r * 9 + c;
  const cellEl = document.querySelectorAll('.cell')[index];

  if(state.solution[r][c] === num) {
    state.board[r][c] = num;
    cellEl.textContent = num;
    cellEl.classList.remove('error');
    cellEl.classList.add('placed');
    checkWin();
  } else {
    state.errors++;
    document.getElementById('errors').textContent = state.errors;
    cellEl.classList.add('error');
    setTimeout(() => cellEl.classList.remove('error'), 300);
  }
}

function erase() {
  if(!state.selected) return;
  const [r, c] = state.selected;
  if(state.given[r][c]) return;

  state.board[r][c] = 0;
  const index = r * 9 + c;
  document.querySelectorAll('.cell')[index].textContent = '';
}

function giveHint() {
  if(!state.selected) return;
  const [r, c] = state.selected;
  if(state.given[r][c]) return;

  placeNumber(state.solution[r][c]);
}

function checkWin() {
  let win = true;
  for(let r = 0; r < 9; r++) {
    for(let c = 0; c < 9; c++) {
      if(state.board[r][c] !== state.solution[r][c]) win = false;
    }
  }

  if(win) {
    clearInterval(state.timerInterval);
    let streak = parseInt(localStorage.getItem('sudoku_streak') || '0') + 1;
    localStorage.setItem('sudoku_streak', streak);
    alert('¡Felicidades! Sudoku completado.');
  }
}

function resetTimer() {
  clearInterval(state.timerInterval);
  state.timer = 0;
  state.timerInterval = setInterval(() => {
    state.timer++;
    const m = String(Math.floor(state.timer / 60)).padStart(2, '0');
    const s = String(state.timer % 60).padStart(2, '0');
    document.getElementById('timer').textContent = `${m}:${s}`;
  }, 1000);
}

// Inicializar teclado numérico
const numpad = document.getElementById('numpad');
for(let i = 1; i <= 9; i++) {
  const btn = document.createElement('button');
  btn.textContent = i;
  btn.addEventListener('click', () => placeNumber(i));
  numpad.appendChild(btn);
}

// Eventos de teclado y botones
document.addEventListener('keydown', (e) => {
  if(e.key >= '1' && e.key <= '9') placeNumber(parseInt(e.key));
  if(e.key === 'Backspace' || e.key === 'Delete') erase();
});

document.getElementById('btnNew').addEventListener('click', startNewGame);
document.getElementById('btnErase').addEventListener('click', erase);
document.getElementById('btnHint').addEventListener('click', giveHint);

// Inicio
startNewGame();
</script>

</body>
</html>
